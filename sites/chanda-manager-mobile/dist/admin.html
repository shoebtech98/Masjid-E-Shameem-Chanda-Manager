<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administration | Chanda Manager</title>
  <link rel="icon" href="/chanda-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
  <script src="/records.js" defer></script>
  <script src="/admin.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <a class="brand" href="/"><img src="/chanda-icon.png" alt="" width="42" height="42"><span>Chanda Manager <small>Masjid E Shameem</small></span></a>
    <nav aria-label="Main navigation"><a href="/">About the app</a><button id="logout" class="quiet" type="button" hidden>Sign out</button></nav>
  </header>
  <main id="main" class="wrap admin">
    <header class="admin-heading">
      <h1>Chanda workspace</h1>
      <p>Manage household contributions, reports, and account access.</p>
    </header>
    <p id="notice" role="status" aria-live="polite"></p>
    <form id="login" class="admin-form" method="post" hidden>
      <h2>Administrator sign-in</h2>
      <label>Email <input name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button" type="submit">Sign in</button>
    </form>
    <div id="workspace" hidden>
      <nav class="admin-tabs" aria-label="Administration sections">
        <button type="button" data-section="home" aria-pressed="true">Home</button>
        <button type="button" data-section="collect" aria-pressed="false">Collect</button>
        <button type="button" data-section="homes" aria-pressed="false">Homes</button>
        <button type="button" data-section="reports" aria-pressed="false">Reports</button>
        <button type="button" data-section="settings" aria-pressed="false">Settings</button>
        <button type="button" data-section="users" aria-pressed="false">Users</button>
        <button type="button" data-section="audit" aria-pressed="false">Audit log</button>
      </nav>
      <section id="record-panel" aria-label="Collection records"></section>
      <section id="users" aria-labelledby="users-title" hidden>
        <h2 id="users-title">User accounts</h2>
        <form id="user-search" class="filters">
          <label>Search users <input type="search" name="search" maxlength="120"></label>
          <button class="quiet" type="submit">Search</button>
          <button class="button" id="add-user" type="button">Add user</button>
        </form>
        <div id="user-list"></div>
      </section>
      <section id="audit" aria-labelledby="audit-title" hidden>
        <h2 id="audit-title">Audit summary</h2>
        <p id="audit-summary"></p>
        <form id="audit-search" class="filters">
          <label>Search activity <input type="search" name="search" maxlength="120"></label>
          <label>Entity <select name="entity"><option value="">All</option><option value="household">Households</option><option value="payment">Payments</option><option value="user">Users</option></select></label>
          <label>Action <select name="action"><option value="">All</option><option value="create">Create</option><option value="update">Update</option><option value="delete">Delete</option><option value="reset">Reset</option><option value="seed">Seed</option></select></label>
          <button class="quiet" type="submit">Search</button>
        </form>
        <p id="audit-count" aria-live="polite"></p>
        <div id="audit-list"></div>
        <button id="audit-more" class="quiet" type="button" hidden>Load more</button>
      </section>
    </div>
  </main>
  <dialog id="account-dialog" aria-labelledby="dialog-title">
    <form id="account-form" class="admin-form" method="post">
      <h2 id="dialog-title"></h2>
      <p id="dialog-error" role="alert"></p>
      <div id="dialog-fields" class="admin-form"></div>
      <div class="actions"><button id="dialog-cancel" class="quiet" type="button">Cancel</button><button id="dialog-submit" class="button" type="submit">Save</button></div>
    </form>
  </dialog>
  <footer class="wrap footer"><span>Masjid E Shameem</span><a href="/">About Chanda Manager</a></footer>
</body>
</html>
